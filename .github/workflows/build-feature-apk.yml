name: Build Feature APK

on:
  push:
    branches:
      - 'claude/add-photo-filtering-*'
      - 'claude/install-flutter-build-apk-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-android:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: build-feature-apk-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/pubspec.lock') }}
          restore-keys: |
            build-feature-apk-${{ runner.os }}-
            build-mobile-gradle-${{ runner.os }}-main

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: ./mobile/pubspec.yaml
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Get Flutter packages
        working-directory: ./mobile
        run: flutter pub get

      - name: Generate translations
        working-directory: ./mobile
        run: |
          dart run easy_localization:generate -S ../i18n
          dart run bin/generate_keys.dart

      - name: Generate platform APIs (pigeon)
        working-directory: ./mobile
        run: make pigeon

      - name: Generate code (build_runner)
        working-directory: ./mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate self-signed keystore
        run: |
          keytool -genkeypair -v \
            -keystore mobile/android/key.jks \
            -alias immich \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Immich CI, OU=CI, O=Immich, L=Unknown, S=Unknown, C=US"

      - name: Build release APK (arm64)
        working-directory: ./mobile
        env:
          ALIAS: immich
          ANDROID_KEY_PASSWORD: android
          ANDROID_STORE_PASSWORD: android
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-release-arm64-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

      - name: Build debug APK (arm64)
        working-directory: ./mobile
        run: flutter build apk --debug --split-per-abi --target-platform android-arm64

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-debug-arm64-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 14
